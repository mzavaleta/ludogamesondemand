<!DOCTYPE html>

<title>Cielo, Siembra, Tierra y Raíces — Traza las Letras</title>
<style>

  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f2f7fd;

    touch-action:manipulation;cursor:pointer;

'use strict';

/* ============================================================
   HELPERS
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const rand  = (a,b)=> a + Math.random()*(b-a);

/* ============================================================
   AUDIO (Web Audio API)
   ============================================================ */
let actx = null, master = null;

function unlockAudio(){
  if(!actx){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = 0.55;
      master.connect(actx.destination);
    }catch(e){ actx = null; return; }
  }
  if(actx.state === 'suspended'){
    try{ actx.resume(); }catch(e){}
  }
}

function tone(freq, dur, type, vol, delay){
  if(!actx) return;
  dur   = dur   == null ? 0.15 : dur;
  type  = type  || 'sine';
  vol   = vol   == null ? 0.18 : vol;
  delay = delay || 0;
  try{
    const t0 = actx.currentTime + delay;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.06);
  }catch(e){}
}

const sfx = {
  tick(){ tone(1500, 0.035, 'sine', 0.045); },
  stroke(){ tone(680, 0.10, 'triangle', 0.16); tone(1020, 0.12, 'triangle', 0.11, 0.07); },
  letter(){ [523.25, 659.25, 783.99, 1046.5].forEach((f,i)=> tone(f, 0.19, 'triangle', 0.15, i*0.085)); },
  wrong(){ tone(190, 0.15, 'sawtooth', 0.09); tone(140, 0.20, 'sawtooth', 0.07, 0.07); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=> tone(f, 0.26, 'triangle', 0.15, i*0.11)); },
  click(){ tone(560, 0.07, 'square', 0.09); }
};

/* Voz (best effort) */
const speechOK = ('speechSynthesis' in window);
function speak(text){
  if(!speechOK) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'es-ES';
    u.rate = 0.85;
    u.pitch = 1.15;
    u.volume = 0.9;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);

/* ============================================================
   LETTER GEOMETRY
   Caja de coordenadas: x 0..1 (ancho), y 0 = CIELO, 0.5 = SIEMBRA, 1 = TIERRA
   MAYÚSCULAS: ocupan de 0 a 1 (cielo → tierra)
   MINÚSCULAS: x-height de 0.5 a 1 (siembra → tierra);
               ascendentes desde 0; descendentes hasta ~1.28 (bajo tierra)
   ============================================================ */
function arcPts(cx, cy, rx, ry, a0, a1, n){
  n = n || 22;
  const out = [];
  for(let i = 0; i <= n; i++){
    const t = a0 + (a1 - a0) * i / n;
    out.push([ cx + rx*Math.cos(t), cy + ry*Math.sin(t) ]);
  }
  return out;
}

/* ---------- MINÚSCULAS (siembra → tierra, ascendentes a cielo, colas bajo tierra) ---------- */
const LOWER_LETTERS = {

const UPPER = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
const LOWER = 'abcdefghijklmnñopqrstuvwxyz'.split('');

/* Secuencia INTERCALADA: A, a, B, b, C, c, … (mayúscula → minúscula) */
const SEQUENCE = [];
for(let i = 0; i < UPPER.length; i++){
  SEQUENCE.push(UPPER[i]);
  SEQUENCE.push(LOWER[i]);
}

const FALLBACK_STROKE = [[0.10,1],[0.90,1]];

function isPoint(p){
  return Array.isArray(p) && p.length >= 2 &&
         typeof p[0] === 'number' && typeof p[1] === 'number' &&
         isFinite(p[0]) && isFinite(p[1]);
}
function isStroke(st){
  return Array.isArray(st) && st.length >= 2 && st.every(isPoint);
}

function dedupe(pts){
  if(!Array.isArray(pts) || !pts.length) return [];
  const out = [pts[0]];
  for(let i=1;i<pts.length;i++){
    const p = pts[i], q = out[out.length-1];
    if(Math.hypot(p[0]-q[0], p[1]-q[1]) > 1e-4) out.push(p);
  }
  return out;
}

function catmull(pts, seg){
  seg = seg || 12;
  const n = pts.length;
  if(n < 2) return pts.slice();
  const out = [];
  for(let i=0;i<n-1;i++){
    const p0 = pts[Math.max(i-1,0)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(i+2,n-1)];
    for(let s=0;s<seg;s++){
      const t = s/seg, t2 = t*t, t3 = t2*t;
      out.push([
        0.5*(2*p1[0] + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*(2*p1[1] + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)
      ]);
    }
  }
  out.push(pts[n-1]);
  return out;
}

function resample(pts, spacing){
  if(pts.length < 2) return pts.slice();
  const out = [pts[0]];
  let carry = 0;
  for(let i=1;i<pts.length;i++){
    const a = pts[i-1], b = pts[i];
    const segLen = Math.hypot(b[0]-a[0], b[1]-a[1]);
    if(segLen < 1e-9) continue;
    let pos = 0;
    while(carry + (segLen - pos) >= spacing){
      const step = spacing - carry;
      pos += step;
      const t = pos / segLen;
      out.push([ a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t ]);
      carry = 0;
    }
    carry += segLen - pos;
  }
  const last = pts[pts.length-1], lo = out[out.length-1];
  if(Math.hypot(last[0]-lo[0], last[1]-lo[1]) > spacing*0.4) out.push(last);
  return out;
}

const compiled = {};
function compileLetter(ch){
  if(compiled[ch]) return compiled[ch];

  let strokes = [];
  try{
    const raw = LETTERS[ch];
    const list = Array.isArray(raw) ? raw : null;
    if(list){
      strokes = list
        .filter(isStroke)
        .map(function(st){
          try{
            const clean = resample(catmull(dedupe(st), 14), 0.011);
            return clean.filter(isPoint);
          }catch(err){ return []; }
        })
        .filter(function(a){ return a && a.length > 1; });
    }
  }catch(err){ strokes = []; }

  if(!strokes.length){
    strokes = [ resample(catmull(dedupe(FALLBACK_STROKE), 14), 0.011) ];
  }

  compiled[ch] = strokes;
  return strokes;
}

/* ============================================================
   CANVAS / LAYOUT
   ============================================================ */
let canvas, ctx, stage, DPR = 1;
let W = 1, H = 1, boxX = 0, topY = 0, letterW = 1, letterH = 1;

const TOP_RESERVE = 0.26;
const BOTTOM_DEPTH = 0.34;

function layout(){
  if(!stage || !canvas) return;
  const r = stage.getBoundingClientRect();
  W = Math.max(80, r.width || 1);
  H = Math.max(80, r.height || 1);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';

  const totalUnits = TOP_RESERVE + 1 + BOTTOM_DEPTH;
  letterH = Math.min(H * 0.88 / totalUnits, (W * 0.94) / 0.72);
  letterW = letterH * 0.72;

  const totalH = letterH * totalUnits;
  topY = (H - totalH) / 2 + letterH * TOP_RESERVE;
  boxX = (W - letterW) / 2;
}

function toScreen(p){
  return { x: boxX + p[0]*letterW, y: topY + p[1]*letterH };
}

/* ============================================================
   GAME STATE
   ============================================================ */
const state = {
  phase: 'start',          // start | play | celebrate | win
  score: 0,
  letterIdx: 0,            // índice sobre SEQUENCE (intercalada)
  strokes: [],             // trazos de la letra actual
  cover: [],               // puntos ya trazados por trazo (Uint8Array)
  covered: [],             // cuántos puntos lleva cada trazo
  lastPaint: null,         // último punto tocado (para cubrir trazos rápidos)
  lastTick: 0,
  tracing: false,
  timeUp: false,
  solved: 0,
  celebrateT: 0,
  shake: 0,
  particles: [],
  floats: [],
  toast: null,
  pointer: { x: 0, y: 0, active: false, key: false }
};

const hudLetter = document.getElementById('hud-letter');
const hudScore  = document.getElementById('hud-score');
const hudSolved = document.getElementById('hud-solved');
const hudTime   = document.getElementById('hud-time');
const overlay   = document.getElementById('overlay');
const winOverlay= document.getElementById('win');
const winTitle  = document.getElementById('win-title');
const winSub    = document.getElementById('win-sub');
const winScore  = document.getElementById('win-score');

/* Sesión por tiempo */
let sessionMinutes = 2;
let endsAt = 0;
let clockId = null;

function formatClock(ms){
  const total = Math.max(0, Math.ceil(ms/1000));
  return Math.floor(total/60) + ':' + String(total%60).padStart(2,'0');
}

function stopClock(){
  if(clockId){ clearInterval(clockId); clockId = null; }
}

function paintClock(){
  hudTime.textContent = formatClock(endsAt - performance.now());
}

function currentLetter(){
  return SEQUENCE[Math.min(state.letterIdx, SEQUENCE.length-1)];
}
function isLowerNow(){
  const ch = currentLetter();
  return ch !== ch.toUpperCase();
}
function curStrokes(){ return compileLetter(currentLetter()); }

function updateHUD(){
  const ch = currentLetter();
  const lo = isLowerNow();
  hudLetter.textContent = ch;
  hudLetter.style.color = lo ? '#ff8c42' : '#2c3e50';
  hudScore.textContent  = state.score;
  hudSolved.textContent = state.solved;
}

/* Prepara la cobertura de trazos de la letra actual. */
function prepareLetter(){
  const strokes = curStrokes();
  state.strokes = strokes;
  state.cover = strokes.map(function(pts){ return new Uint8Array(pts.length); });
  state.covered = strokes.map(function(){ return 0; });
  state.lastPaint = null;
  state.lastTick = 0;
  state.tracing = false;
}

function strokeDone(s){
  const pts = state.strokes[s];
  return !!pts && state.covered[s] >= pts.length;
}

function firstIncomplete(){
  for(let s=0;s<state.strokes.length;s++){
    if(!strokeDone(s)) return s;
  }
  return -1;
}

/* ============================================================
   FEEDBACK
   ============================================================ */
function burst(x, y, n, colors){
  for(let i=0;i<n;i++){
    const a = Math.random()*TAU;
    const sp = rand(50, 290);
    state.particles.push({
      x, y,
      vx: Math.cos(a)*sp,
      vy: Math.sin(a)*sp - 70,
      life: rand(0.45, 1.0),
      max: 1,
      color: colors[(Math.random()*colors.length)|0],
      size: rand(2.5, 6.5),
      grav: 620
    });
  }
}

function addFloat(x, y, text, color){
  state.floats.push({ x, y, text, color, life: 0.95, max: 0.95 });
}

function showToast(text){
  state.toast = { text, t: 0, dur: 1.1 };
}

let lastWrong = 0;
function wrongFeedback(){
  const now = performance.now();
  if(now - lastWrong < 650) return;
  lastWrong = now;
  sfx.wrong();
  state.shake = Math.max(state.shake, 4);
}

/* ============================================================
   TRACING LOGIC
   ============================================================ */
function tolPx(){ return Math.max(16, letterH * 0.12); }

/* Cualquier punto de cualquier trazo sirve como entrada: no hay orden ni
   sentido obligatorio. El trazo se pinta donde pasa el dedo. */
function nearestStrokePoint(x, y, maxDist){
  let best = null, bestD = maxDist;
  for(let s=0;s<state.strokes.length;s++){
    if(strokeDone(s)) continue;
    const pts = state.strokes[s];
    for(let i=0;i<pts.length;i++){
      const sp = toScreen(pts[i]);
      const d = Math.hypot(sp.x - x, sp.y - y);
      if(d < bestD){ bestD = d; best = { s: s, i: i }; }
    }
  }
  return best;
}

function distToSegment(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay;
  const len2 = dx*dx + dy*dy;
  let t = len2 ? ((px-ax)*dx + (py-ay)*dy) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t*dx), py - (ay + t*dy));
}

function paintAt(x, y){
  const tol = tolPx();
  const prev = state.lastPaint || { x: x, y: y };
  const wasDone = state.strokes.map(function(_, s){ return strokeDone(s); });
  let marked = 0;

  // El dedo pinta toda línea que toca: sin trazo activo ni dirección fija.
  for(let s=0;s<state.strokes.length;s++){
    if(wasDone[s]) continue;
    const pts = state.strokes[s];
    const cover = state.cover[s];
    for(let i=0;i<pts.length;i++){
      const sp = toScreen(pts[i]);
      // Cubre lo que pasa entre dos eventos: un trazo rápido no deja huecos.
      const d = distToSegment(sp.x, sp.y, prev.x, prev.y, x, y);
      if(d <= tol && !cover[i]){ cover[i] = 1; state.covered[s]++; marked++; }
    }
  }
  state.lastPaint = { x: x, y: y };

  if(marked > 0){
    const now = performance.now();
    if(now - state.lastTick > 90){ state.lastTick = now; sfx.tick(); }
  }

  const justDone = [];
  for(let s=0;s<state.strokes.length;s++){
    if(!wasDone[s] && state.covered[s] >= state.strokes[s].length) justDone.push(s);
  }
  if(!justDone.length) return;

  state.tracing = false;
  justDone.forEach(function(s){ awardStroke(s); });

  const next = firstIncomplete();
  if(next < 0) completeLetter();
  else if(state.pointer.key) snapKeyboardCursor();
}

function tryStart(x, y){
  if(state.phase !== 'play' && state.phase !== 'timeup') return false;
  const hit = nearestStrokePoint(x, y, tolPx() * 1.8);
  if(!hit) return false;
  state.tracing = true;
  state.lastPaint = { x: x, y: y };
  tone(900, 0.05, 'sine', 0.06);
  paintAt(x, y);
  return true;
}

function traceAt(x, y){
  if(!state.tracing) return;
  paintAt(x, y);
}

function awardStroke(s){
  const pts = state.strokes[s];
  if(!pts || !pts.length) return;
  const endP = toScreen(pts[pts.length-1]);

  burst(endP.x, endP.y, 16, ['#ffb86b','#ff7f50','#ffd166','#7be09a']);
  state.shake = Math.max(state.shake, 5);
  sfx.stroke();

  state.score += 15;
  addFloat(endP.x, endP.y - 24, '+15', '#ff7f50');
  updateHUD();
}

function completeLetter(){
  state.phase = 'celebrate';
  state.celebrateT = 1.15;
  state.score += 45;
  state.solved++;
  updateHUD();

  const ch = currentLetter();
  sfx.letter();
  speak(ch);
  showToast('¡' + ch + '!');

  const cx = W/2, cy = topY + letterH*0.5;
  burst(cx, cy, 34, ['#ff7f50','#ffd166','#7be09a','#6c5ce7','#4dabf7','#ff9ff3']);
  state.shake = Math.max(state.shake, 9);
}

function nextLetter(){
  // Con tiempo agotado ya no aparece otra letra: se cierra la sesión.
  if(state.timeUp){ endRound(); return; }

  state.letterIdx++;
  if(state.letterIdx >= SEQUENCE.length) state.letterIdx = 0;   // vuelta al inicio
  prepareLetter();

  state.phase = 'play';
  updateHUD();
  speak(currentLetter());
  if(state.pointer.key) snapKeyboardCursor();
}

function endRound(){
  state.phase = 'win';
  stopClock();
  paintClock();
  winScore.textContent = state.solved;
  winTitle.textContent = '¡Se acabó el tiempo! ⏰';
  winSub.textContent   = state.solved + (state.solved === 1 ? ' letra · ' : ' letras · ') +
    state.score + ' puntos';
  winOverlay.classList.remove('hidden');
  sfx.win();
  speak('¡Muy bien!');
}

/* ============================================================
   KEYBOARD CURSOR
   ============================================================ */
function snapKeyboardCursor(){
  const s = firstIncomplete();
  if(s < 0) return;
  const pts = state.strokes[s];
  if(!pts || !pts.length) return;
  let i = 0;
  while(i < pts.length && state.cover[s][i]) i++;
  const p = toScreen(pts[Math.min(i, pts.length-1)]);
  state.pointer.x = p.x;
  state.pointer.y = p.y;
  state.pointer.active = true;
  state.pointer.key = true;
  state.tracing = true;
}

/* ============================================================
   INPUT  —  Pointer + Touch + Mouse (móvil, tablet y escritorio)
   ============================================================ */
const lastDownAt = { pointer: -1e9, touch: -1e9, mouse: -1e9 };

function localPoint(clientX, clientY){
  const r = canvas.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}

function beginAt(x, y, src){
  unlockAudio();
  const now = performance.now();
  for(const k in lastDownAt){
    if(k !== src && (now - lastDownAt[k]) < 450) return;
  }
  lastDownAt[src] = now;

  if(state.phase !== 'play') return;

  state.pointer.x = x;
  state.pointer.y = y;
  state.pointer.active = true;
  state.pointer.key = false;
  state.tracing = false;

  if(!tryStart(x, y)) wrongFeedback();
}

function moveAt(x, y){
  if(state.phase !== 'play') return;
  if(state.pointer.key) return;
  if(!state.pointer.active) return;
  state.pointer.x = x;
  state.pointer.y = y;
  if(state.tracing) traceAt(x, y);
}

function endAt(){
  if(state.pointer.key) return;
  state.pointer.active = false;
  state.tracing = false;
}

/* --- pointer --- */
function onPointerDown(e){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  const p = localPoint(e.clientX, e.clientY);
  beginAt(p.x, p.y, 'pointer');
  if(canvas.setPointerCapture && e.pointerId != null){
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  }
  if(e.cancelable) e.preventDefault();
}

function onPointerMove(e){
  const p = localPoint(e.clientX, e.clientY);
  moveAt(p.x, p.y);
  if(state.pointer.active && e.cancelable) e.preventDefault();
}

function onPointerUp(){
  endAt();
}

/* --- touch --- */
function onTouchStart(e){
  unlockAudio();
  const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
  if(t){
    const p = localPoint(t.clientX, t.clientY);
    beginAt(p.x, p.y, 'touch');
  }
  if(e.cancelable) e.preventDefault();
}

function onTouchMove(e){
  const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
  if(t){
    const p = localPoint(t.clientX, t.clientY);
    moveAt(p.x, p.y);
  }
  if(e.cancelable) e.preventDefault();
}

function onTouchEnd(e){
  if(e.touches && e.touches.length > 0) return;
  endAt();
  if(e.cancelable) e.preventDefault();
}

/* --- mouse (respaldo) --- */
function onMouseDown(e){
  if(e.button !== 0) return;
  const p = localPoint(e.clientX, e.clientY);
  beginAt(p.x, p.y, 'mouse');
}

function onMouseMove(e){
  const p = localPoint(e.clientX, e.clientY);
  moveAt(p.x, p.y);
}

/* ============================================================
   KEYBOARD
   ============================================================ */
const keys = new Set();
const KEYMAP = {
  arrowup:[0,-1], w:[0,-1],
  arrowdown:[0,1], s:[0,1],
  arrowleft:[-1,0], a:[-1,0],
  arrowright:[1,0], d:[1,0]
};

window.addEventListener('keydown', function(e){
  const k = (e.key || '').toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k) >= 0) e.preventDefault();

  if(k === ' ' || k === 'enter'){
    if(state.phase === 'win'){ unlockAudio(); restartGame(); return; }
  }
  if(state.phase !== 'play') return;
  if(!KEYMAP[k]) return;

  if(!state.pointer.active || !state.pointer.key){
    snapKeyboardCursor();
  }
  keys.add(k);
});

window.addEventListener('keyup', function(e){
  keys.delete((e.key || '').toLowerCase());
});

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.vy += p.grav * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    if(p.life <= 0) state.particles.splice(i,1);
  }
  for(let i=state.floats.length-1;i>=0;i--){
    const f = state.floats[i];
    f.y -= 46 * dt;
    f.life -= dt;
    if(f.life <= 0) state.floats.splice(i,1);
  }
  if(state.toast){
    state.toast.t += dt;
    if(state.toast.t > state.toast.dur) state.toast = null;
  }
  if(state.shake > 0) state.shake = Math.max(0, state.shake - dt * 34);

  if(state.phase === 'celebrate'){
    state.celebrateT -= dt;
    if(state.celebrateT <= 0) nextLetter();
  }

  if(state.phase === 'play' && state.pointer.key){
    let dx = 0, dy = 0;
    if(keys.has('arrowleft') || keys.has('a')) dx -= 1;
    if(keys.has('arrowright')|| keys.has('d')) dx += 1;
    if(keys.has('arrowup')   || keys.has('w')) dy -= 1;
    if(keys.has('arrowdown') || keys.has('s')) dy += 1;
    if(dx || dy){
      const len = Math.hypot(dx,dy);
      const speed = Math.max(300, letterH * 1.6);
      state.pointer.x = clamp(state.pointer.x + dx/len*speed*dt, 0, W);
      state.pointer.y = clamp(state.pointer.y + dy/len*speed*dt, 0, H);
      traceAt(state.pointer.x, state.pointer.y);
    }
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function roundRect(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

function strokePoly(pts){
  if(!pts || pts.length < 2) return;
  const p0 = toScreen(pts[0]);
  ctx.beginPath();
  ctx.moveTo(p0.x, p0.y);
  for(let i=1;i<pts.length;i++){
    const p = toScreen(pts[i]);
    ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
}

function drawZones(){
  const mid    = topY + letterH*0.5;
  const base   = topY + letterH;
  const bottom = base + letterH*BOTTOM_DEPTH;
  const skyTop = topY - letterH*TOP_RESERVE*0.85;

  const gl = Math.max(6, boxX - letterW*0.42);
  const gr = Math.min(W-6, boxX + letterW*1.42);
  const gw = gr - gl;

  let g1 = ctx.createLinearGradient(0, skyTop, 0, mid);
  g1.addColorStop(0, '#eef8ff');
  g1.addColorStop(1, '#cfe8ff');
  ctx.fillStyle = g1;
  roundRect(gl, skyTop, gw, mid - skyTop, 14); ctx.fill();

  let g2 = ctx.createLinearGradient(0, mid, 0, base);
  g2.addColorStop(0, '#eefbe7');
  g2.addColorStop(1, '#c9f0bc');
  ctx.fillStyle = g2;
  roundRect(gl, mid, gw, base - mid, 10); ctx.fill();

  let g3 = ctx.createLinearGradient(0, base, 0, bottom);
  g3.addColorStop(0, '#f6ebdf');
  g3.addColorStop(1, '#dcc3a8');
  ctx.fillStyle = g3;
  roundRect(gl, base, gw, bottom - base, 12); ctx.fill();

  ctx.lineCap = 'butt';

  ctx.strokeStyle = '#74b3e8';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(gl, topY); ctx.lineTo(gr, topY); ctx.stroke();

  ctx.strokeStyle = '#69c45e';
  ctx.lineWidth = 2.5;
  ctx.setLineDash([11, 9]);
  ctx.beginPath(); ctx.moveTo(gl, mid); ctx.lineTo(gr, mid); ctx.stroke();
  ctx.setLineDash([]);

  ctx.strokeStyle = '#b98a5a';
  ctx.lineWidth = 4.5;
  ctx.beginPath(); ctx.moveTo(gl, base); ctx.lineTo(gr, base); ctx.stroke();

  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const fs = Math.max(9, Math.min(12, W*0.028));
  ctx.font = '800 ' + fs + 'px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillStyle = 'rgba(90,140,200,.7)';
  ctx.fillText('CIELO', gl + 10, skyTop + fs*1.2);
  ctx.fillStyle = 'rgba(70,150,70,.72)';
  ctx.fillText('SIEMBRA', gl + 10, mid + fs*1.1);
  ctx.fillStyle = 'rgba(150,110,70,.85)';
  ctx.fillText('TIERRA', gl + 10, base + (bottom - base)*0.55);

  /* indicador de caja (Aa / ABC) arriba a la derecha */
  const lo = isLowerNow();
  ctx.textAlign = 'right';
  ctx.font = '800 ' + (fs*1.05) + 'px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.fillStyle = lo ? 'rgba(255,140,66,.8)' : 'rgba(108,92,231,.55)';
  ctx.fillText(lo ? 'abc' : 'ABC', gr - 10, skyTop + fs*1.2);
}

function drawStrokes(){
  const strokes = state.strokes;
  if(!strokes || !strokes.length) return;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const thickTraced = Math.max(7, letterH * 0.062);
  const thickGhost  = Math.max(4, letterH * 0.030);
  const dash = [letterH*0.032, letterH*0.042];

  function paintRun(run){
    if(run.length > 1){
      ctx.strokeStyle = '#ff7f50';
      ctx.lineWidth = thickTraced;
      ctx.shadowColor = 'rgba(255,127,80,.6)';
      ctx.shadowBlur = letterH * 0.07;
      strokePoly(run);
      ctx.shadowBlur = 0;
    }else if(run.length === 1){
      const q = toScreen(run[0]);
      ctx.beginPath();
      ctx.arc(q.x, q.y, thickTraced*0.5, 0, TAU);
      ctx.fillStyle = '#ff7f50';
      ctx.fill();
    }
  }

  for(let s=0;s<strokes.length;s++){
    const pts = strokes[s];
    if(!pts || pts.length < 2) continue;

    if(strokeDone(s)){
      ctx.setLineDash([]);
      ctx.strokeStyle = 'rgba(126,205,126,.85)';
      ctx.lineWidth = thickTraced;
      strokePoly(pts);
      continue;
    }

    // Guía punteada completa: se puede empezar por cualquier punto.
    ctx.setLineDash(dash);
    ctx.strokeStyle = 'rgba(150,168,190,.6)';
    ctx.lineWidth = thickGhost;
    strokePoly(pts);
    ctx.setLineDash([]);

    const cover = state.cover[s];
    let run = [];
    for(let i=0;i<pts.length;i++){
      if(cover[i]){
        run.push(pts[i]);
      }else{
        paintRun(run);
        run = [];
      }
    }
    paintRun(run);
  }

}

function drawParticles(){
  for(let i=0;i<state.particles.length;i++){
    const p = state.particles[i];
    const a = clamp(p.life / 0.55, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.5 + a*0.6), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloats(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(let i=0;i<state.floats.length;i++){
    const f = state.floats[i];
    const a = clamp(f.life / f.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.font = '900 ' + Math.max(16, letterH*0.10) + 'px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawToast(){
  if(!state.toast) return;
  const t = state.toast.t, d = state.toast.dur;
  const p = clamp(t/d, 0, 1);
  const scale = p < 0.25 ? (0.6 + (p/0.25)*0.5) : 1.1 - (p-0.25)*0.13;
  const alpha = p > 0.72 ? 1 - (p-0.72)/0.28 : 1;
  ctx.save();
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.translate(W/2, topY + letterH*0.46);
  ctx.scale(scale, scale);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fs = Math.max(36, Math.min(letterH*0.42, W*0.24));
  ctx.font = '900 ' + fs + 'px -apple-system,Segoe UI,Roboto,sans-serif';
  ctx.lineWidth = fs*0.14;
  ctx.strokeStyle = 'rgba(255,255,255,.95)';
  ctx.strokeText(state.toast.text, 0, 0);
  ctx.fillStyle = isLowerNow() ? '#ff8c42' : '#6c5ce7';
  ctx.fillText(state.toast.text, 0, 0);
  ctx.restore();
}

function drawCursor(){
  if(!state.pointer.key || state.phase !== 'play') return;
  const x = state.pointer.x, y = state.pointer.y;
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, letterH*0.05, 0, TAU);
  ctx.fillStyle = 'rgba(108,92,231,.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.9)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function render(){
  if(!ctx) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#f6faff';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if(state.shake > 0.25){
    ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));
  }
  drawZones();
  drawStrokes();
  drawParticles();
  drawFloats();
  drawToast();
  drawCursor();
  ctx.restore();
}

/* ============================================================
   GAME FLOW
   ============================================================ */
function resetState(){
  state.score = 0;
  state.letterIdx = 0;
  state.solved = 0;
  state.timeUp = false;
  state.lastTick = 0;
  state.tracing = false;
  state.celebrateT = 0;
  state.shake = 0;
  state.particles.length = 0;
  state.floats.length = 0;
  state.toast = null;
  state.pointer.active = false;
  state.pointer.key = false;
  keys.clear();
  prepareLetter();
}

function startSession(minutes){
  sessionMinutes = minutes;
  state.phase = 'play';
  try{
    unlockAudio();
    sfx.click();
    resetState();
    if(overlay)    overlay.classList.add('hidden');
    if(winOverlay) winOverlay.classList.add('hidden');
    hudTime.style.color = '#2c3e50';
    endsAt = performance.now() + minutes * 60000;
    stopClock();
    paintClock();
    clockId = setInterval(function(){
      if(state.phase === 'win'){ stopClock(); return; }
      paintClock();
      if(!state.timeUp && performance.now() >= endsAt) endTime();
    }, 250);
    layout();
    updateHUD();
    speak(currentLetter());
    if(state.pointer.key) snapKeyboardCursor();
  }catch(err){
    console.error('startSession', err);
  }
}

/* Se acabó el tiempo: no aparece otra letra, pero la que está en pantalla se
   puede terminar. La sesión sólo cierra sola si la letra ya estaba hecha. */
function endTime(){
  state.timeUp = true;
  paintClock();
  hudTime.style.color = '#ff4d6d';
  if(state.phase === 'celebrate'){ endRound(); return; }
  sfx.wrong();
  showToast('¡Tiempo! Termina esta letra');
}

function showSetup(){
  stopClock();
  state.phase = 'start';
  if(winOverlay) winOverlay.classList.add('hidden');
  if(overlay)    overlay.classList.remove('hidden');
  hudTime.textContent = '0:00';
  hudTime.style.color = '#2c3e50';
}

function restartGame(){
  startSession(sessionMinutes);
}

/* ============================================================
   BOTONES — táctil + ratón + teclado (robusto en DevTools móvil)
   ============================================================ */
function bindTap(el, fn){
  if(!el) return;

  let handled = false;

  function arm(){ handled = false; }

  function fire(e){
    if(handled) return;
    handled = true;
    if(e){
      if(e.cancelable){ try{ e.preventDefault(); }catch(_){} }
      if(e.stopPropagation){ try{ e.stopPropagation(); }catch(_){} }
    }
    try{ unlockAudio(); }catch(_){}
    try{ fn(); }catch(err){ console.error(err); }
  }

  el.addEventListener('pointerdown', arm, { passive:true });
  el.addEventListener('touchstart',  arm, { passive:true });
  el.addEventListener('mousedown',   arm, { passive:true });

  el.addEventListener('pointerup',   fire, { passive:false });
  el.addEventListener('touchend',    fire, { passive:false });
  el.addEventListener('mouseup',     fire, { passive:false });
  el.addEventListener('click',       fire, { passive:false });

  el.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
      if(e.cancelable) e.preventDefault();
      arm();
      fire(e);
    }
  });
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  stage = document.getElementById('stage');

  layout();
  updateHUD();

  /* ---- CANVAS: pointer ---- */
  canvas.addEventListener('pointerdown', onPointerDown, { passive:false });
  canvas.addEventListener('pointermove', onPointerMove, { passive:false });
  canvas.addEventListener('pointerup',   onPointerUp,   { passive:false });
  canvas.addEventListener('pointercancel', onPointerUp, { passive:false });

  /* ---- CANVAS: touch ---- */
  canvas.addEventListener('touchstart', onTouchStart, { passive:false });
  canvas.addEventListener('touchmove',  onTouchMove,  { passive:false });
  canvas.addEventListener('touchend',   onTouchEnd,   { passive:false });
  canvas.addEventListener('touchcancel', onTouchEnd,  { passive:false });

  /* ---- CANVAS: mouse ---- */
  canvas.addEventListener('mousedown', onMouseDown, { passive:false });
  canvas.addEventListener('mousemove', onMouseMove, { passive:false });

  /* ---- FIN DE GESTO EN CUALQUIER LUGAR ---- */
  window.addEventListener('pointerup',   function(){ endAt(); }, true);
  window.addEventListener('pointercancel', function(){ endAt(); }, true);
  window.addEventListener('mouseup',     function(){ endAt(); }, true);
  window.addEventListener('touchend',    function(e){
    if(!e.touches || e.touches.length === 0) endAt();
  }, { passive:true });
  window.addEventListener('touchcancel', function(){ endAt(); }, { passive:true });
  window.addEventListener('blur',        function(){ endAt(); });

  /* ---- evitar gestos del navegador sobre el lienzo ---- */
  stage.addEventListener('touchmove', function(e){ e.preventDefault(); }, { passive:false });
  stage.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  canvas.addEventListener('dblclick', function(e){ e.preventDefault(); });
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive:false });
  document.addEventListener('touchmove', function(e){
    if(e.touches && e.touches.length > 1 && e.cancelable) e.preventDefault();
  }, { passive:false });

  /* ---- BOTONES ---- */
  document.querySelectorAll('#times [data-min]').forEach(function(btn){
    btn.addEventListener('click', function(){
      try{ unlockAudio(); }catch(_){}
      startSession(Number(btn.dataset.min));
    });
  });
  bindTap(document.getElementById('btn-again'), restartGame);
  bindTap(document.getElementById('btn-next'),  showSetup);
  bindTap(document.getElementById('btn-reset'), function(){ restartGame(); });

  /* ---- redimensionado ---- */
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 120); });
  if(window.visualViewport){
    try{
      window.visualViewport.addEventListener('resize', layout);
      window.visualViewport.addEventListener('scroll', layout);
    }catch(e){}
  }
  if(window.ResizeObserver){
    try{ new ResizeObserver(function(){ layout(); }).observe(stage); }catch(e){}
  }
  setTimeout(layout, 80);
  setTimeout(layout, 400);

  SEQUENCE.forEach(function(ch){
    try{ compileLetter(ch); }catch(e){ console.warn('letra', ch, e); }
  });

  updateHUD();

  let last = performance.now();
  function loop(t){
    const dt = Math.min(0.05, Math.max(0.001, (t - last) / 1000));
    last = t;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

try{
  boot();
}catch(err){
  console.error(err);
  const p = document.querySelector('#overlay .panel');
  if(p){
    p.innerHTML = '<h1>¡Ups!</h1><p class="sub">Algo falló al cargar el juego.<br>Recarga la página para intentarlo de nuevo.</p>' +
                  '<button type="button" class="btn" onclick="location.reload()">Recargar</button>';
  }
}
})();
</script>
